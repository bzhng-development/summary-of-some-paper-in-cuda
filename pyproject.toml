[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-summaries"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.3",
    "aiosqlite>=0.20.0",
    "anthropic>=0.84.0",
    "beautifulsoup4>=4.14.2",
    "click>=8.3.0",
    "fastapi>=0.135.1",
    "frozenlist>=1.8.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "markdownify>=1.2.0",
    "numpy>=2.4.0",
    "openai>=2.6.1",
    "openai-agents>=0.4.2",
    "orjson>=3.11.5",
    "pandas>=2.3.3",
    "playwright>=1.57.0",
    "polars>=1.36.1",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic>=2.12.3",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "substack-api>=1.3.0",
    "tenacity>=9.1.2",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.1",
    "typer>=0.26.7",
    "uvicorn>=0.38.0",
]

[project.scripts]
paper-summarize = "paper_pipeline.summarize.cli:main"
paper-summarize-single = "paper_pipeline.cli.main:main"
paper-sync = "paper_pipeline.cli.sync:main"
paper-server = "paper_pipeline.ingest.paper_server:main"
paper-fetch = "paper_pipeline.ingest.hf_daily_papers:main"
paper-tag = "paper_pipeline.ingest.tag_papers:main"
paper-import-jsonl = "paper_pipeline.core.import_jsonl:main"
paper-e2e = "paper_pipeline.cli.e2e:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_pipeline"]

[dependency-groups]
dev = [
    "mdformat>=0.7.22",
    "mdformat-admon>=2.1.1",
    "mdformat-mkdocs>=4.4.2",
    "mkdocs-git-revision-date-localized-plugin>=1.5.0",
    "mkdocs-llmstxt>=0.4.0",
    "mkdocs-material>=9.6.23",
    "mkdocs-redirects>=1.2.2",
    "pre-commit>=4.3.0",
    "pyrefly>=0.39.4",
    "ruff>=0.14.3",
    "ty>=0.0.1a25",
]

[tool.pyrefly]
project_includes = ["src"]
project_excludes = ["**/.[!/.]*", ".venv/**", "__pycache__/**", "arxiv.py/**", "prompt_iter/**", "src/paper_pipeline/discovery/**", "src/paper_pipeline/probes/**", "src/paper_pipeline/regen/**", "src/paper_pipeline/tagging/**", "src/paper_pipeline/substack/**"]
search_path = ["src"]
python_version = "3.14"

[tool.ty.src]
exclude = ["arxiv.py", "prompt_iter", ".venv", "__pycache__", "src/paper_pipeline/discovery", "src/paper_pipeline/probes", "src/paper_pipeline/regen", "src/paper_pipeline/tagging", "src/paper_pipeline/substack"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"
extraPaths = ["src"]
exclude = [".venv", "**/__pycache__", "local_data", "docs_backup", "arxiv.py", "prompt_iter", "src/paper_pipeline/discovery", "src/paper_pipeline/probes", "src/paper_pipeline/regen", "src/paper_pipeline/tagging", "src/paper_pipeline/substack"]

[tool.ruff]
line-length = 120
# py312, NOT py314: the pipeline deploys to a Python 3.12 cluster/OCR box. Under a
# py314 target, ruff applies PEP 758 and strips the parens off `except (A, B):` →
# `except A, B:`, a SyntaxError on 3.12. Pinning py312 stops that rewrite from firing.
# (Local dev runs 3.14, but 3.12 is the deployment floor.)
target-version = "py312"

[tool.ruff.lint]
# Curated "beautiful Python" set: correctness + idiom + modern syntax, minus the
# ceremony families (docstrings / annotate-everything / print / bandit / complexity)
# that are pure noise in a research/pipeline codebase.
select = [
    "F",        # pyflakes — real bugs (undefined names, unused imports/vars)
    "E", "W",   # pycodestyle — errors + warnings (incl. W605 invalid escapes)
    "I",        # isort — import ordering
    "UP",       # pyupgrade — modern syntax for the target Python
    "B",        # flake8-bugbear — likely bugs & footguns
    "SIM",      # flake8-simplify — simpler equivalent forms
    "C4",       # flake8-comprehensions — cleaner comprehensions
    "PIE",      # flake8-pie — misc idiom upgrades
    "RET",      # flake8-return — tidy return flows
    "RSE",      # flake8-raise — drop needless parens on raise
    "FLY",      # flynt — "".join(...) → f-string
    "PERF",     # perflint — obvious perf anti-patterns
    "FURB",     # refurb — modernizing refactors
    "ICN",      # flake8-import-conventions — np/pd-style aliases
    "LOG",      # flake8-logging — logging correctness
    "PGH",      # pygrep-hooks — no blanket noqa / type-ignore / eval
    "PLE",      # pylint — errors only (skip the noisy refactor/convention sets)
    "A",        # flake8-builtins — don't shadow builtins
    "YTT",      # flake8-2020 — correct sys.version checks
    "NPY",      # numpy-specific guardrails
    "RUF",      # ruff-native rules
]
ignore = [
    "E501",     # line length — the formatter wraps code; the rest are long URLs/prompts/prose
    "E402",     # module import not at top — scripts set sys.path / load env first
    "E741",     # ambiguous names (l/I/O) — fine for throwaway loop vars
    "RUF001",   # ambiguous unicode in strings — intentional en-dashes/arrows in prompts & prose
    "RUF002",   #   …in docstrings
    "RUF003",   #   …in comments
    "PGH003",   # blanket type-ignore — fixing needs a type-checker pass to name codes
]

[tool.ruff.lint.per-file-ignores]
# These closures are awaited within the same loop iteration, so capturing the
# loop variable by reference is safe — B023 is a false positive here.
"src/paper_pipeline/regen/offline_regen.py" = ["B023"]
"src/paper_pipeline/summarize/summarizer.py" = ["B023"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
